name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libegl-dev libxkbcommon-dev shellcheck
      - name: Shellcheck
        run: shellcheck -s sh install.sh uninstall.sh scripts/* tools/adblock-update.sh system/bsdtv-session system/bsdtv-drm-browser system/xinitrc system/profile.snippet
      - name: Installer dry run
        run: sh install.sh --dry-run --adblock --ssh --drm --audio-unit 1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
